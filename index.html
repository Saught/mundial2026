<style>

  :root {
    --bg:#0a0e1a; --surface:#111827; --card:#1a2235; --border:#2a3a55;
    --gold:#f5c542; --teal:#00c9b1; --red:#e63946; --text:#e8edf5; --muted:#7a8faa;
    --green:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  header{background:linear-gradient(135deg,#0d1b2e,#162035,#0a1525);border-bottom:2px solid var(--gold);padding:18px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(245,197,66,.15);}
  .hball{font-size:32px;animation:bob 3s ease-in-out infinite;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:var(--gold);}
  .controls{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.75rem;transition:all .2s;}
  .filter-btn:hover,.filter-btn.active{background:var(--gold);color:#000;font-weight:600;}
  .country-select,.search-box{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.75rem;}
  .main{padding:20px;max-width:1400px;margin:0 auto;}
  .day-section{margin-bottom:28px;}
  .day-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);}
  .day-date{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--gold);}
  .matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px;}
  .match-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;}
  .match-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--group-color,var(--teal));opacity:.8;}
  .match-meta{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.62rem;color:var(--muted);}
  .group-tag{font-weight:700;padding:2px 8px;border-radius:4px;color:#000;text-transform:uppercase;}
  .teams-row{display:flex;align-items:center;gap:6px;}
  .team{flex:1;text-align:center;font-size:.72rem;font-weight:600;}
  .score-box{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:10px;padding:7px 10px;border:1px solid var(--border);}
  .score-num{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);}
  .players-row{border-top:1px solid var(--border);padding-top:9px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.6rem;color:var(--muted);}
  .hidden{display:none!important;}
</style>

  btn.className = 'filter-btn';
  btn.innerText = d.split('-')[2] + ' Jun';
  btn.onclick = () => { filterDay(d, btn); };
  document.getElementById('date-filters').appendChild(btn);
});

function applyFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const group = document.getElementById('group-filter').value;
  let filtered = matches;
  if (currentDay !== 'all') filtered = filtered.filter(m => m.date === currentDay);
  if (group) filtered = filtered.filter(m => m.group === group);
  if (search) filtered = filtered.filter(m => m.home.toLowerCase().includes(search) || m.away.toLowerCase().includes(search));
  renderMatches(filtered);
}

function renderMatches(data) {
  const container = document.getElementById('matches-container');
  container.innerHTML = '';
  const byDay = {};
  data.forEach(m => { if(!byDay[m.date]) byDay[m.date] = []; byDay[m.date].push(m); });
  
  Object.keys(byDay).sort().forEach(date => {
    const section = document.createElement('div');
    section.className = 'day-section';
    section.innerHTML = `<div class="day-header"><span class="day-date">📅 ${date}</span></div><div class="matches-grid"></div>`;
    data.filter(m => m.date === date).forEach(m => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.style.setProperty('--group-color', GC[m.group] || '#ccc');
      card.innerHTML = `
        <div class="match-meta"><span class="group-tag" style="background:${GC[m.group]}">Grupo ${m.group}</span><span>📍 ${m.venue}</span></div>
        <div class="teams-row">
          <div class="team">${m.hf}<br>${m.home}</div>
          <div class="score-box"><span class="score-num">${m.hs}</span> - <span class="score-num">${m.as}</span></div>
          <div class="team">${m.af}<br>${m.away}</div>
        </div>
        <div class="players-row">
          <div>⚡ ${m.hkey.join(', ')}</div>
          <div style="text-align:right">⚡ ${m.akey.join(', ')}</div>
        </div>
      `;
      section.querySelector('.matches-grid').appendChild(card);
    });
    container.appendChild(section);
  });
}

function filterDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

renderMatches(matches);
