<style>

  :root {

    --green:#22c55e;
  }

  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  header{background:linear-gradient(135deg,#0d1b2e,#162035,#0a1525);border-bottom:2px solid var(--gold);padding:18px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(245,197,66,.15);}
  .hball{font-size:32px;animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:var(--gold);line-height:1;}
  header p{font-size:.7rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .hright{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .badge{background:var(--gold);color:#000;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.8px;text-transform:uppercase;}

  .controls{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .ctrl-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:4px;white-space:nowrap;}
  .filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.75rem;font-family:'Inter',sans-serif;transition:all .2s;}
  .filter-btn:hover,.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600;}
  .country-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.75rem;font-family:'Inter',sans-serif;outline:none;cursor:pointer;min-width:140px;}
  .country-select:focus{border-color:var(--gold);}
  .search-box{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:999px;font-size:.75rem;font-family:'Inter',sans-serif;outline:none;width:190px;}
  .search-box:focus{border-color:var(--gold);}
  .search-box::placeholder,.country-select option{color:var(--muted);}

  .main{padding:20px;max-width:1400px;margin:0 auto;}
  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
  .stat-card .num{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);line-height:1;}
  .stat-card .lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}

  .day-section{margin-bottom:28px;}
  .day-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);}
  .day-date{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;color:var(--gold);}
  .day-count{background:var(--surface);color:var(--muted);font-size:.65rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);}

  .matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px;}
  .match-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;transition:all .25s;position:relative;overflow:hidden;}
  .match-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--group-color,var(--teal));opacity:.8;}
  .match-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,197,66,.1);}
  .match-card.highlighted{border-color:var(--gold) !important;box-shadow:0 0 0 2px rgba(245,197,66,.3);}

  .match-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .group-tag{font-size:.62rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--group-color,var(--teal));color:#000;}
  .match-venue{font-size:.62rem;color:var(--muted);text-align:right;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .teams-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .team{flex:1;text-align:center;}
  .team-flag{font-size:1.9rem;display:block;margin-bottom:3px;}
  .team-name{font-size:.72rem;font-weight:600;letter-spacing:.4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .score-display{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:65px;}
  .score-box{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:10px;padding:7px 10px;border:1px solid var(--border);}
  .score-num{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);line-height:1;min-width:16px;text-align:center;}
  .score-sep{color:var(--muted);font-size:1.1rem;}
  .vs-label{font-size:.58rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .outcome-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.4px;margin-top:2px;}
  .outcome-h{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);}
  .outcome-d{background:rgba(245,197,66,.15);color:var(--gold);border:1px solid rgba(245,197,66,.3);}
  .outcome-a{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3);}

  .players-row{border-top:1px solid var(--border);padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:3px;}
  .player-side{font-size:.6rem;color:var(--muted);}
  .player-side strong{display:block;color:var(--teal);font-size:.65rem;margin-bottom:2px;}
  .player-side span{display:block;line-height:1.6;}

  .no-results{text-align:center;padding:60px 20px;color:var(--muted);}
  .no-results .icon{font-size:3rem;margin-bottom:12px;}
  .hidden{display:none!important;}

  @media(max-width:640px){
    .stats-bar{grid-template-columns:repeat(2,1fr);}
    .matches-grid{grid-template-columns:1fr;}
    header h1{font-size:1.3rem;}
    .ctrl-row{gap:5px;}
    .search-box,.country-select{width:100%;}
  }
</style>

let currentDay='all', currentGroup='', currentCountry='', currentSearch='';

function renderMatches(filtered){
  const container=document.getElementById('matches-container');
  const noRes=document.getElementById('no-results');
  container.innerHTML='';
  if(!filtered.length){noRes.classList.remove('hidden');return;}
  noRes.classList.add('hidden');
  const byDay={};
  filtered.forEach(m=>{if(!byDay[m.date])byDay[m.date]=[];byDay[m.date].push(m);});
  Object.keys(byDay).sort().forEach(date=>{
    const ms=byDay[date];
    const sec=document.createElement('div');sec.className='day-section';
    sec.innerHTML=`<div class="day-header"><span class="day-date">📅 ${DN[date]||date}</span><span class="day-count">${ms.length} partido${ms.length>1?'s':''}</span></div><div class="matches-grid" id="grid-${date.replace(/-/g,'')}"></div>`;
    container.appendChild(sec);
    const grid=sec.querySelector(`#grid-${date.replace(/-/g,'')}`);
    ms.forEach(m=>grid.appendChild(buildCard(m,currentCountry)));
  });
}

function buildCard(m, highlightCountry){
  const c=GC[m.group]||'#00c9b1';
  const card=document.createElement('div');
  card.className='match-card'+(highlightCountry&&(m.home===highlightCountry||m.away===highlightCountry)?' highlighted':'');
  card.style.setProperty('--group-color',c);
  const hkeys=m.hkey.map(p=>`<span>${p}</span>`).join('');
  const akeys=m.akey.map(p=>`<span>${p}</span>`).join('');
  card.innerHTML=`
    <div class="match-meta">
      <span class="group-tag" style="background:${c}">Grupo ${m.group}</span>
      <span class="match-venue">📍 ${m.venue}</span>
    </div>
    <div class="teams-row">
      <div class="team"><span class="team-flag">${m.hf}</span><div class="team-name">${m.home}</div></div>
      <div class="score-display">
        <div class="score-box"><span class="score-num">${m.hs}</span><span class="score-sep">–</span><span class="score-num">${m.as}</span></div>
        <span class="vs-label">Predicción</span>
        <span class="outcome-badge ${OC[m.out]}">${OL[m.out]}</span>
      </div>
      <div class="team"><span class="team-flag">${m.af}</span><div class="team-name">${m.away}</div></div>
    </div>
    <div class="players-row">
      <div class="player-side"><strong>⚡ ${m.home}</strong>${hkeys}</div>
      <div class="player-side" style="text-align:right"><strong>⚡ ${m.away}</strong>${akeys}</div>
    </div>`;
  return card;
}

function filterDay(day,btn){
  currentDay=day;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  apply();
}
function filterGroup(val){currentGroup=val;apply();}
function filterCountry(val){currentCountry=val;apply();}
function searchMatches(val){currentSearch=val.toLowerCase().trim();apply();}
function apply(){
  let f=matches;
  if(currentDay!=='all') f=f.filter(m=>m.date===currentDay);
  if(currentGroup) f=f.filter(m=>m.group===currentGroup);
  if(currentCountry) f=f.filter(m=>m.home===currentCountry||m.away===currentCountry);
  if(currentSearch) f=f.filter(m=>
    m.home.toLowerCase().includes(currentSearch)||
    m.away.toLowerCase().includes(currentSearch)||
    m.hkey.some(p=>p.toLowerCase().includes(currentSearch))||
    m.akey.some(p=>p.toLowerCase().includes(currentSearch))
  );
  renderMatches(f);
}
renderMatches(matches);
